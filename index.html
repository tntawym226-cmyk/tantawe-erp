              <button onclick="openScreen('asset-scrap')" data-nav="asset-scrap" class="nav-btn w-full text-right px-3 py-1 rounded text-xs text-slate-400 hover:text-white hover:bg-slate-800/60">تخريد أصل</button>

      <button onclick="openScreen('sql')" data-nav="sql" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800/80 transition">
        <i class="fas fa-database w-5 text-indigo-400"></i>

  <!-- منطقة المحتوى الرئيسية -->
  <main class="flex-1 flex flex-col min-w-0">
    <!-- شريط علوي -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 id="screen-title" class="text-lg font-extrabold text-white">لوحة التحكم</h2>
        <p id="screen-subtitle" class="text-xs text-slate-400">نظرة عامة على أرصدة المخزون والخزينة والحركات المحاسبية</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="company-badge" class="px-3 py-1 rounded-full text-xs bg-blue-950 text-blue-300 border border-blue-800/60">
          شركة الطنطاوي التجارية
        </span>
        <button onclick="resetDemoData()" class="px-3 py-1.5 rounded-lg text-xs bg-slate-800 hover:bg-rose-950 hover:text-rose-200 border border-slate-700 transition">
          <i class="fas fa-rotate-left ml-1"></i>إعادة ضبط البيانات
        </button>
      </div>
    </header>

    <!-- تنبيهات النظام -->
    <div id="toast-box" class="px-6 pt-3 hidden">
      <div id="toast-inner" class="px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-between border"></div>
    </div>

    <!-- المحتوى المتغير -->
    <section id="content-area" class="p-6 flex-1 overflow-y-auto space-y-6"></section>
  </main>

  <script>
    const STORAGE_KEY = 'tantawe_erp_v1';

    const defaultState = {
      company: { name: 'شركة الطنطاوي التجارية', taxId: '305-991-440', phone: '01000000000', address: 'شبين الكوم - المنوفية' },
      branches: ['الفرع الرئيسي', 'فرع طنطا'],
      agents: [{ name: 'أحمد حسن', role: 'مندوب مبيعات', commission: 3 }],
      regions: ['المنوفية', 'الغربية', 'القاهرة'],
      suppliers: [{ name: 'مورد الشاشات المتحدة', phone: '01111111111', balance: 0 }],
      customers: [{ name: 'عميل نقدي / معرض السلام', phone: '01222222222', balance: 0 }],
      categories: ['إلكترونيات', 'أجهزة مكتبية'],
      items: [
        { code: 'ITM-01', name: 'شاشة 24 بوصة', category: 'إلكترونيات', qty: 7, cost: 1000, price: 1350 }
      ],
      accounts: [
        { code: '1101', name: 'الخزينة الرئيسية', type: 'أصول', debit: 0, credit: 0 },
        { code: '1102', name: 'البنك الأهلي', type: 'أصول', debit: 0, credit: 0 },
        { code: '1103', name: 'حساب المخزون', type: 'أصول', debit: 10000, credit: 3000 },
        { code: '1104', name: 'العملاء', type: 'أصول', debit: 0, credit: 0 },
        { code: '1201', name: 'الأصول الثابتة', type: 'أصول', debit: 0, credit: 0 },
        { code: '1202', name: 'مجمع إهلاك الأصول الثابتة', type: 'أصول', debit: 0, credit: 0 },
        { code: '2101', name: 'الموردون', type: 'خصوم', debit: 0, credit: 0 },
        { code: '4101', name: 'إيرادات المبيعات', type: 'إيرادات', debit: 0, credit: 0 },
        { code: '5101', name: 'تكلفة البضاعة المباعة', type: 'مصروفات', debit: 0, credit: 0 },
        { code: '5102', name: 'مصروف الإهلاك', type: 'مصروفات', debit: 0, credit: 0 },
        { code: '5103', name: 'أرباح / خسائر رأسمالية وتخريد', type: 'مصروفات', debit: 0, credit: 0 },
        { code: '5109', name: 'حساب تسوية المخزون', type: 'مصروفات', debit: 3000, credit: 10000 }
      ],
      assets: [],
      movements: [
        { date: '2026-11-19', type: 'إذن إضافة داخلي', item: 'شاشة 24 بوصة', qty: 10, cost: 1000, note: 'إضافة افتتاحية' },
        { date: '2026-11-19', type: 'إذن صرف داخلي', item: 'شاشة 24 بوصة', qty: -3, cost: 1000, note: 'صرف داخلي 3 قطع' }
      ],
      entries: [
        { desc: 'إذن إضافة داخلي - شاشات', lines: [{ acc: '1103', dr: 10000, cr: 0 }, { acc: '5109', dr: 0, cr: 10000 }] },
        { desc: 'إذن صرف داخلي - شاشات', lines: [{ acc: '5109', dr: 3000, cr: 0 }, { acc: '1103', dr: 0, cr: 3000 }] }
      ]
    };

    let state = loadState();
    let currentScreen = 'dashboard';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : structuredClone(defaultState);
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateCompanyBadge();
    }

    function resetDemoData() {
      state = structuredClone(defaultState);
      saveState();
      notify('تمت إعادة ضبط بيانات النظام إلى الحالة الافتراضية.', 'info');
      openScreen(currentScreen);
    }

    function updateCompanyBadge() {
      document.getElementById('company-badge').textContent = state.company.name || 'TANTAWE ERP';
    }

    function notify(msg, type = 'success') {
      const box = document.getElementById('toast-box');
      const inner = document.getElementById('toast-inner');
      const styles = {
        success: 'bg-emerald-950/90 text-emerald-200 border-emerald-700',
        error: 'bg-rose-950/90 text-rose-200 border-rose-700',
        info: 'bg-blue-950/90 text-blue-200 border-blue-700'
      };
      inner.className = `px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center justify-between border ${styles[type] || styles.info}`;
      inner.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.parentElement.classList.add('hidden')" class="text-xs opacity-75 hover:opacity-100">إغلاق</button>`;
      box.classList.remove('hidden');
    }

    function toggleGroup(id) {
      const el = document.getElementById(id);
      const icon = document.getElementById('icon-' + id);
      el.classList.toggle('open');
      if (icon) icon.classList.toggle('rotate-180');
    }

    function toggleMobileNav() {
      document.getElementById('sidebar-nav').classList.toggle('hidden');
    }

    function postEntry(desc, lines) {
      const totalDr = lines.reduce((s, l) => s + Number(l.dr || 0), 0);
      const totalCr = lines.reduce((s, l) => s + Number(l.cr || 0), 0);
      if (Math.abs(totalDr - totalCr) > 0.001) {
        notify(`القيد غير متوازن! المدين (${totalDr}) لا يساوي الدائن (${totalCr})`, 'error');
        return false;
      }
      lines.forEach(l => {
        const acc = state.accounts.find(a => a.code === l.acc);
        if (acc) {
          acc.debit = Number(acc.debit || 0) + Number(l.dr || 0);
          acc.credit = Number(acc.credit || 0) + Number(l.cr || 0);
        }
      });
      state.entries.unshift({ desc, lines });
      return true;
    }

    function adjustStock(itemName, deltaQty, unitCost, movementType, note = '') {
      const item = state.items.find(i => i.name === itemName);
      if (!item) {
        notify('الصنف غير موجود في قائمة الأصناف.', 'error');
        return false;
      }
      const nextQty = Number(item.qty) + Number(deltaQty);
      if (nextQty < 0) {
        notify(`الرصيد المتاح غير كافٍ للصرف! المتاح حالياً من "${item.name}": ${item.qty}`, 'error');
        return false;
      }
      if (deltaQty > 0 && unitCost > 0) {
        const prevVal = Number(item.qty) * Number(item.cost);
        const addVal = Number(deltaQty) * Number(unitCost);
        item.cost = nextQty > 0 ? Number(((prevVal + addVal) / nextQty).toFixed(2)) : Number(unitCost);
      }
      item.qty = nextQty;
      state.movements.unshift({
        date: new Date().toISOString().slice(0, 10),
        type: movementType,
        item: item.name,
        qty: Number(deltaQty),
        cost: Number(unitCost || item.cost),
        note
      });
      return true;
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString('ar-EG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const screenMeta = {
      dashboard: ['لوحة التحكم', 'ملخص سريع للمخزون، الخزينة، البنوك، والقيود المحاسبية'],
      company: ['اسم الشركة وبياناتها', 'تحديث اسم الشركة والبيانات الأساسية للنظام'],
      branches: ['الفروع', 'إضافة وإدارة فروع الشركة'],
      agents: ['المناديب والمسوقين', 'تعريف مندوبي المبيعات والمسوقين ونسب العمولة'],
      regions: ['المناطق', 'إدارة المناطق الجغرافية وخطوط التوزيع'],
      'add-supplier': ['إضافة مورد', 'تسجيل مورد جديد في دليل الموردين'],
      'purchase-order': ['أمر شراء', 'إصدار أمر شراء للموردين'],
      'purchase-invoice': ['فاتورة مشتريات', 'تسجيل فاتورة شراء مع زيادة المخزون وإثبات القيد المحاسبي'],
      'add-customer': ['إضافة عميل', 'تسجيل عميل جديد في دليل العملاء'],
      'sales-order': ['أمر بيع', 'إصدار أمر بيع للعملاء'],
      'sales-invoice': ['فاتورة بيع', 'إصدار فاتورة بيع مع خصم المخزون وقيد الإيراد وتكلفة البضاعة المباعة'],
      categories: ['فئات الأصناف', 'تصنيف مجموعات الأصناف المخزنية'],
      items: ['الأصناف', 'إضافة وتعديل الأصناف وأسعار التكلفة والبيع'],
      'wh-in': ['إذن إضافة مخزني', 'إدخال كميات للمخزن ورفع رصيد المخزون'],
      'wh-out': ['إذن صرف مخزني', 'صرف كميات من المخزن مع التحقق من عدم وجود رصيد سالب'],
      'int-in': ['إذن إضافة داخلي', 'تسجيل إضافة داخلية للمخزن مع قيد تسوية المخزون'],

    function openScreen(name) {
      currentScreen = name;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('bg-blue-600/20', btn.dataset.nav === name);
        btn.classList.toggle('text-blue-300', btn.dataset.nav === name);
        btn.classList.toggle('font-bold', btn.dataset.nav === name);
      });
      const meta = screenMeta[name] || ['TANTAWE ERP', ''];
      document.getElementById('screen-title').textContent = meta[0];
      document.getElementById('screen-subtitle').textContent = meta[1];
      renderScreen(name);
    }

          ${bodyHtml}
        </div>`;
    }

                ${state.accounts.map(a => {
                  const net = Number(a.debit || 0) - Number(a.credit || 0);
                  return `<tr><td class="py-2 font-mono text-blue-300">${a.code}</td><td class="py-2 text-white font-semibold">${a.name}</td><td class="py-2">${a.type}</td><td class="py-2">${fmt(a.debit)}</td><td class="py-2">${fmt(a.credit)}</td><td class="py-2 font-bold ${net >= 0 ? 'text-emerald-300' : 'text-amber-300'}">${fmt(net)}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `);
        return;
      }

      if (name === 'cash-banks') {
        area.innerHTML = card('الخزن والبنوك — سندات القبض والصرف', `
          <form onsubmit="submitTreasuryVoucher(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">
            <div><label class="block text-xs text-slate-400 mb-1">نوع السند</label><select id="tr-type" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2"><option value="receipt">سند قبض (إيداع)</option><option value="payment">سند صرف (سحب)</option></select></div>
            <div><label class="block text-xs text-slate-400 mb-1">الخزينة / البنك</label><select id="tr-cb" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2"><option value="1101">الخزينة الرئيسية (1101)</option><option value="1102">البنك الأهلي (1102)</option></select></div>
            <div><label class="block text-xs text-slate-400 mb-1">الحساب المقابل</label><select id="tr-opp" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2">${state.accounts.filter(a => !['1101','1102'].includes(a.code)).map(a => `<option value="${a.code}">${a.code} - ${a.name}</option>`).join('')}</select></div>
            <div><label class="block text-xs text-slate-400 mb-1">المبلغ</label><input id="tr-amt" type="number" step="0.01" min="0.01" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" required /></div>
            <div class="md:col-span-3"><input id="tr-desc" placeholder="بيان السند" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" /></div>
            <div><button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg">ترحيل السند</button></div>
          </form>
        `);
        return;
      }

      if (['asset-add', 'asset-buy', 'asset-sell', 'asset-depreciate', 'asset-scrap'].includes(name)) {
        const assetOptions = state.assets.length
          ? state.assets.map((a, idx) => `<option value="${idx}">${a.name} (القيمة: ${fmt(a.value)} | مجمع الإهلاك: ${fmt(a.dep)})</option>`).join('')
          : `<option value="">لا توجد أصول مسجلة بعد</option>`;

        let formHtml = '';
        if (name === 'asset-add') {
          formHtml = `
            <form onsubmit="addAsset(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
              <input id="as-name" placeholder="اسم الأصل الثابت (مثال: سيارة نقل)" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" required />
              <input id="as-val" type="number" step="0.01" min="0.01" placeholder="القيمة التاريخية" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" required />
              <button class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg">إضافة الأصل</button>
            </form>`;
        } else if (name === 'asset-buy') {
          formHtml = `
            <form onsubmit="buyAsset(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">
              <input id="ab-name" placeholder="اسم الأصل المشترى" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" required />
              <input id="ab-val" type="number" step="0.01" min="0.01" placeholder="تكلفة الشراء" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" required />
              <select id="ab-pay" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2"><option value="1101">الخزينة الرئيسية</option><option value="1102">البنك الأهلي</option><option value="2101">الموردون (آجل)</option></select>
              <button class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg">شراء وترحيل القيد</button>
            </form>`;
        } else if (name === 'asset-sell') {
          formHtml = `
            <form onsubmit="sellAsset(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">
              <select id="asel-idx" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2">${assetOptions}</select>
              <input id="asel-price" type="number" step="0.01" min="0" placeholder="سعر البيع" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" required />
              <select id="asel-cb" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2"><option value="1101">تحصيل بالخزينة</option><option value="1102">تحصيل بالبنك</option></select>
              <button class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-lg">تنفيذ بيع الأصل</button>
            </form>`;
        } else if (name === 'asset-depreciate') {
          formHtml = `
            <form onsubmit="depreciateAsset(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
              <select id="adep-idx" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2">${assetOptions}</select>
              <input id="adep-amt" type="number" step="0.01" min="0.01" placeholder="قيمة قسط الإهلاك" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2" required />
              <button class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg">ترحيل قيد الإهلاك</button>
            </form>`;
        } else if (name === 'asset-scrap') {
          formHtml = `
            <form onsubmit="scrapAsset(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              <select id="ascr-idx" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2">${assetOptions}</select>
              <button class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-lg">تخريد الأصل وترحيل القيد</button>
            </form>`;
        }

        const titles = {
          'asset-add': 'الأصول الثابتة — إضافة أصل',
          'asset-buy': 'الأصول الثابتة — شراء أصل',
          'asset-sell': 'الأصول الثابتة — بيع أصل',
          'asset-depreciate': 'الأصول الثابتة — إهلاك أصل',
          'asset-scrap': 'الأصول الثابتة — تخريد أصل'
        };

        area.innerHTML = `
          ${card(titles[name], formHtml)}
          ${card('سجل الأصول الثابتة', `
            <table class="w-full text-sm text-right">
              <thead class="text-xs text-slate-400 border-b border-slate-800"><tr><th class="py-2">الأصل</th><th class="py-2">القيمة التاريخية</th><th class="py-2">مجمع الإهلاك</th><th class="py-2">الحالة</th></tr></thead>
              <tbody class="divide-y divide-slate-800/60">
                ${state.assets.length ? state.assets.map(a => `<tr><td class="py-2 text-white font-semibold">${a.name}</td><td class="py-2">${fmt(a.value)}</td><td class="py-2 text-amber-300">${fmt(a.dep)}</td><td class="py-2">${a.status}</td></tr>`).join('') : `<tr><td colspan="4" class="py-3 text-center text-slate-500">لا توجد أصول مسجلة</td></tr>`}
              </tbody>
            </table>
          `)}
        `;
        return;
      }

      if (name === 'reports') {
        area.innerHTML = `
          ${card('ميزان المراجعة', `
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-right">
                <thead class="text-xs text-slate-400 border-b border-slate-800"><tr><th class="py-2">كود</th><th class="py-2">الحساب</th><th class="py-2">مدين</th><th class="py-2">دائن</th><th class="py-2">الرصيد</th></tr></thead>
                <tbody class="divide-y divide-slate-800/60">
                  ${state.accounts.map(a => {
                    const net = Number(a.debit || 0) - Number(a.credit || 0);
                    return `<tr><td class="py-2 font-mono">${a.code}</td><td class="py-2 text-white">${a.name}</td><td class="py-2">${fmt(a.debit)}</td><td class="py-2">${fmt(a.credit)}</td><td class="py-2 font-bold">${fmt(net)}</td></tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `)}
          ${card('تقرير حركات المخزون', `
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-right">
                <thead class="text-xs text-slate-400 border-b border-slate-800"><tr><th class="py-2">التاريخ</th><th class="py-2">نوع الحركة</th><th class="py-2">الصنف</th><th class="py-2">الكمية</th><th class="py-2">التكلفة</th><th class="py-2">البيان</th></tr></thead>
                <tbody class="divide-y divide-slate-800/60">
                  ${state.movements.map(m => `<tr><td class="py-2">${m.date}</td><td class="py-2 text-cyan-300">${m.type}</td><td class="py-2 text-white">${m.item}</td><td class="py-2 font-bold">${m.qty}</td><td class="py-2">${fmt(m.cost)}</td><td class="py-2 text-slate-400">${m.note || '-'}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `)}
        `;
        return;
      }

      if (name === 'sql') {
        const sqlLines = [
          '-- أوامر ترحيل الأرصدة الحالية إلى Supabase (PostgreSQL)',
          ...state.accounts.map(a =>
            `UPDATE accounts SET debit = ${Number(a.debit || 0)}, credit = ${Number(a.credit || 0)} WHERE code = '${a.code}';`
          )
        ].join('\n');

        area.innerHTML = card('تصدير SQL لـ Supabase', `
          <p class="text-xs text-slate-400 mb-3">انسخ الأوامر التالية والصقها في SQL Editor داخل Supabase لتحديث أرصدة الحسابات:</p>
          <textarea id="sql-output" rows="12" readonly class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs font-mono text-emerald-300">${sqlLines}</textarea>
          <button onclick="copySql()" class="mt-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-lg text-sm">نسخ كود SQL</button>
        `);
      }
    }

    function saveCompany(e) {
      e.preventDefault();
      state.company = {
        name: document.getElementById('c-name').value.trim(),
        taxId: document.getElementById('c-tax').value.trim(),
        phone: document.getElementById('c-phone').value.trim(),
        address: document.getElementById('c-addr').value.trim()
      };
      saveState();
      notify('تم حفظ بيانات الشركة بنجاح.');
    }

    function addSimpleList(e, key) {
      e.preventDefault();
      const val = document.getElementById('simple-val').value.trim();
      if (!val) return;
      state[key].push(val);
      saveState();
      notify(`تمت إضافة "${val}" بنجاح.`);
      renderScreen(currentScreen);
    }

    function addAgent(e) {
      e.preventDefault();
      state.agents.push({
        name: document.getElementById('ag-name').value.trim(),
        role: document.getElementById('ag-role').value,
        commission: Number(document.getElementById('ag-comm').value)
      });
      saveState();
      notify('تمت إضافة المندوب/المسوق بنجاح.');
      renderScreen(currentScreen);
    }

    function addParty(e, key) {
      e.preventDefault();
      state[key].push({
        name: document.getElementById('p-name').value.trim(),
        phone: document.getElementById('p-phone').value.trim(),
        balance: Number(document.getElementById('p-bal').value || 0)
      });
      saveState();
      notify('تم الحفظ بنجاح.');
      renderScreen(currentScreen);
    }

    function createOrder(e, orderType) {
      e.preventDefault();
      const party = document.getElementById('ord-party').value;
      const item = document.getElementById('ord-item').value;
      const qty = Number(document.getElementById('ord-qty').value);
      state.movements.unshift({
        date: new Date().toISOString().slice(0, 10),
        type: orderType,
        item,
        qty,
        cost: 0,
        note: `لصالح: ${party}`
      });
      saveState();
      notify(`تم تسجيل ${orderType} لـ ${party} بكمية ${qty}.`);
    }

    function submitPurchaseInvoice(e) {
      e.preventDefault();
      const sup = document.getElementById('pi-sup').value;
      const itemName = document.getElementById('pi-item').value;
      const payAcc = document.getElementById('pi-pay').value;
      const qty = Number(document.getElementById('pi-qty').value);
      const cost = Number(document.getElementById('pi-cost').value);
      const total = qty * cost;

      if (!adjustStock(itemName, qty, cost, 'فاتورة مشتريات', `مورد: ${sup}`)) return;
      if (!postEntry(`فاتورة مشتريات (${itemName}) - مورد: ${sup}`, [
        { acc: '1103', dr: total, cr: 0 },
        { acc: payAcc, dr: 0, cr: total }
      ])) return;

      saveState();
      notify(`تم ترحيل فاتورة المشتريات بقيمة ${fmt(total)} وتحديث المخزون والحسابات.`);
      renderScreen(currentScreen);
    }

    function submitSalesInvoice(e) {
      e.preventDefault();
      const cus = document.getElementById('si-cus').value;
      const itemName = document.getElementById('si-item').value;
      const payAcc = document.getElementById('si-pay').value;
      const qty = Number(document.getElementById('si-qty').value);
      const price = Number(document.getElementById('si-price').value);
      const itemObj = state.items.find(i => i.name === itemName);
      if (!itemObj) return;

      const unitCost = Number(itemObj.cost || 0);
      const revTotal = qty * price;
      const cogsTotal = qty * unitCost;

      if (!adjustStock(itemName, -qty, unitCost, 'فاتورة بيع', `عميل: ${cus}`)) return;

      const okRev = postEntry(`فاتورة بيع (${itemName}) - عميل: ${cus}`, [
        { acc: payAcc, dr: revTotal, cr: 0 },
        { acc: '4101', dr: 0, cr: revTotal }
      ]);
      const okCogs = postEntry(`تكلفة بضاعة مباعة (${itemName})`, [
        { acc: '5101', dr: cogsTotal, cr: 0 },
        { acc: '1103', dr: 0, cr: cogsTotal }
      ]);

      if (!okRev || !okCogs) return;
      saveState();
      notify(`تم ترحيل فاتورة البيع بقيمة ${fmt(revTotal)} وتكلفة مبيعات ${fmt(cogsTotal)}.`);
      renderScreen(currentScreen);
    }

    function addItem(e) {
      e.preventDefault();
      state.items.push({
        code: document.getElementById('it-code').value.trim(),
        name: document.getElementById('it-name').value.trim(),
        category: document.getElementById('it-cat').value,
        qty: 0,
        cost: Number(document.getElementById('it-cost').value),
        price: Number(document.getElementById('it-price').value)
      });
      saveState();
      notify('تمت إضافة الصنف بنجاح.');
      renderScreen(currentScreen);
    }

    function submitStockVoucher(e, title, sign, drAcc, crAcc) {
      e.preventDefault();
      const itemName = document.getElementById('sv-item').value;
      const qty = Number(document.getElementById('sv-qty').value);
      const cost = Number(document.getElementById('sv-cost').value);
      const note = document.getElementById('sv-note').value.trim();
      const amount = qty * cost;

      if (!adjustStock(itemName, sign * qty, cost, title, note)) return;
      if (!postEntry(`${title} - ${itemName}`, [
        { acc: drAcc, dr: amount, cr: 0 },
        { acc: crAcc, dr: 0, cr: amount }
      ])) return;

      saveState();
      notify(`تم تنفيذ ${title} بقيمة ${fmt(amount)}.`);
      renderScreen(currentScreen);
    }

    function addAccount(e) {
      e.preventDefault();
      const code = document.getElementById('acc-code').value.trim();
      if (state.accounts.some(a => a.code === code)) {
        notify('كود الحساب موجود مسبقاً.', 'error');
        return;
      }
      state.accounts.push({
        code,
        name: document.getElementById('acc-name').value.trim(),
        type: document.getElementById('acc-type').value,
        debit: 0,
        credit: 0
      });
      saveState();
      notify('تمت إضافة الحساب إلى شجرة الحسابات.');
      renderScreen(currentScreen);
    }

    function submitTreasuryVoucher(e) {
      e.preventDefault();
      const type = document.getElementById('tr-type').value;
      const cbAcc = document.getElementById('tr-cb').value;
      const oppAcc = document.getElementById('tr-opp').value;
      const amt = Number(document.getElementById('tr-amt').value);
      const desc = document.getElementById('tr-desc').value.trim() || (type === 'receipt' ? 'سند قبض' : 'سند صرف');

      const lines = type === 'receipt'
        ? [{ acc: cbAcc, dr: amt, cr: 0 }, { acc: oppAcc, dr: 0, cr: amt }]
        : [{ acc: oppAcc, dr: amt, cr: 0 }, { acc: cbAcc, dr: 0, cr: amt }];

      if (!postEntry(desc, lines)) return;
      saveState();
      notify(`تم ترحيل السند بقيمة ${fmt(amt)}.`);
      renderScreen(currentScreen);
    }

    function addAsset(e) {
      e.preventDefault();
      state.assets.push({
        name: document.getElementById('as-name').value.trim(),
        value: Number(document.getElementById('as-val').value),
        dep: 0,
        status: 'نشط'
      });
      saveState();
      notify('تمت إضافة الأصل الثابت.');
      renderScreen(currentScreen);
    }

    function buyAsset(e) {
      e.preventDefault();
      const name = document.getElementById('ab-name').value.trim();
      const val = Number(document.getElementById('ab-val').value);
      const payAcc = document.getElementById('ab-pay').value;

      if (!postEntry(`شراء أصل ثابت: ${name}`, [
        { acc: '1201', dr: val, cr: 0 },
        { acc: payAcc, dr: 0, cr: val }
      ])) return;

      state.assets.push({ name, value: val, dep: 0, status: 'نشط' });
      saveState();
      notify(`تم شراء الأصل "${name}" وترحيل القيد.`);
      renderScreen(currentScreen);
    }

    function sellAsset(e) {
      e.preventDefault();
      const idx = Number(document.getElementById('asel-idx').value);
      const asset = state.assets[idx];
      if (!asset) return;
      const price = Number(document.getElementById('asel-price').value);
      const cbAcc = document.getElementById('asel-cb').value;
      const bookVal = Number(asset.value) - Number(asset.dep);
      const diff = price - bookVal;

      const lines = [
        { acc: cbAcc, dr: price, cr: 0 },
        { acc: '1202', dr: Number(asset.dep), cr: 0 },
        { acc: '1201', dr: 0, cr: Number(asset.value) }
      ];
      if (diff >= 0) {
        lines.push({ acc: '5103', dr: 0, cr: diff });
      } else {
        lines.push({ acc: '5103', dr: Math.abs(diff), cr: 0 });
      }

      if (!postEntry(`بيع أصل ثابت: ${asset.name}`, lines)) return;
      asset.status = `مباع (${fmt(price)})`;
      saveState();
      notify(`تم بيع الأصل "${asset.name}" وترحيل القيد.`);
      renderScreen(currentScreen);
    }

    function depreciateAsset(e) {
      e.preventDefault();
      const idx = Number(document.getElementById('adep-idx').value);
      const asset = state.assets[idx];
      if (!asset) return;
      const amt = Number(document.getElementById('adep-amt').value);

      if (!postEntry(`إهلاك أصل ثابت: ${asset.name}`, [
        { acc: '5102', dr: amt, cr: 0 },
        { acc: '1202', dr: 0, cr: amt }
      ])) return;

      asset.dep = Number(asset.dep) + amt;
      saveState();
      notify(`تم ترحيل إهلاك بقيمة ${fmt(amt)} للأصل "${asset.name}".`);
      renderScreen(currentScreen);
    }

    function scrapAsset(e) {
      e.preventDefault();
      const idx = Number(document.getElementById('ascr-idx').value);
      const asset = state.assets[idx];
      if (!asset) return;
      const rem = Math.max(0, Number(asset.value) - Number(asset.dep));

      const lines = [{ acc: '1201', dr: 0, cr: Number(asset.value) }];
      if (Number(asset.dep) > 0) lines.push({ acc: '1202', dr: Number(asset.dep), cr: 0 });
      if (rem > 0) lines.push({ acc: '5103', dr: rem, cr: 0 });

      if (!postEntry(`تخريد أصل ثابت: ${asset.name}`, lines)) return;
      asset.status = 'مُخرّد';
      saveState();
      notify(`تم تخريد الأصل "${asset.name}" وترحيل القيد.`);
      renderScreen(currentScreen);
    }

    function copySql() {
      const ta = document.getElementById('sql-output');
      ta.select();
      document.execCommand('copy');
      notify('تم نسخ أوامر SQL بنجاح.');
    }

    toggleGroup('grp-accounting');
    toggleGroup('grp-assets');
    updateCompanyBadge();
    openScreen('dashboard');
  </script>
</body>
</html>
